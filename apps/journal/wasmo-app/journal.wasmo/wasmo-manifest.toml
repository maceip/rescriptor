target = 'https://wasmo.com/sdk/1'
version = 1

[[external_resource]]
from = '../../admin-web-app/build/dist/js/productionExecutable'
to = '/www/assets'
include = ['**/*.js', '**/*.js.map']

# Everything this app is able to do. See docs/platform/capabilities.md.
[[capability]]
name = 'clock'

# Its own default database, via SQLDelight.
[[capability]]
name = 'sql'

# Attachments people upload, and the public site rendered from them.
[[capability]]
name = 'object_store'
allow = ['attachments/**', 'www-public/**']

# Rendering the public site happens off the request path.
[[capability]]
name = 'jobs'
allow = ['publish-site']

[launcher]
label = 'Journal'
maskable_icon_path = '/assets/maskable-icon.svg'
home_path = '/admin'
