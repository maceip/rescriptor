<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!--
    Anisotropic fractal noise: a very low frequency across x and a high frequency down y draws out
    long horizontal streaks, which is what a brushed finish physically is. stitchTiles keeps the
    320px tile seamless so large plates do not show a repeat.
  -->
  <filter id="brush" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.011 0.83"
      numOctaves="2"
      seed="11"
      stitchTiles="stitch"
    />
    <feColorMatrix
      values="0.19 0.19 0.19 0 0.215
              0.19 0.19 0.19 0 0.215
              0.19 0.19 0.19 0 0.215
              0    0    0    0 1"
    />
  </filter>
  <rect width="320" height="320" filter="url(#brush)" />
</svg>
